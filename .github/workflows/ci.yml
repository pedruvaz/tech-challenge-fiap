name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev, 'feat/**']
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oficina

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instala dependências
        run: npm ci

      - name: Gera Prisma Client
        run: npx prisma generate

      - name: Build
        run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oficina

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instala dependências
        run: npm ci

      - name: Gera Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

  test:
    name: Testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oficina
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oficina"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: oficina
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oficina
      JWT_ACCESS_SECRET: ci-test-secret
      JWT_ACCESS_EXPIRES_IN: 3600s
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      JWT_REFRESH_EXPIRES_IN: 7d

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instala dependências
        run: npm ci

      - name: Gera Prisma Client
        run: npx prisma generate

      - name: Aplica migrations
        run: npx prisma migrate deploy

      - name: Roda seed
        run: npx prisma db seed

      - name: Testes unitários (com gate de cobertura)
        run: npm run test:cov

      - name: Testes e2e
        run: npm run test:e2e

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  docker:
    name: Docker Build
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Valida docker-compose
        run: docker compose config -q

      - name: Configura Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem (validação)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: oficina-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  push:
    name: Push para o ECR
    # Toda merge na main publica a imagem com a tag do SHA (é ela que o Deploy
    # leva ao EKS) e atualiza a tag latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      id-token: write # OIDC: troca o token do GitHub por credenciais temporárias da AWS
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Autentica na AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login no ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configura Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push (tags SHA e latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [build, lint, test, docker, push]
    if: always()

    steps:
      - name: Quality Gate
        run: |
          # "docker" é skipped em push para main (substituído pelo job "push").
          # "push"   é skipped em PRs e branches que não sejam main.
          # Skipped é aceito em ambos; qualquer outro resultado falha o gate.
          if [[ "${{ needs.build.result }}"  != "success" || \
                "${{ needs.lint.result }}"   != "success" || \
                "${{ needs.test.result }}"   != "success" || \
                ("${{ needs.docker.result }}" != "success" && "${{ needs.docker.result }}" != "skipped") || \
                ("${{ needs.push.result }}"   != "success" && "${{ needs.push.result }}"   != "skipped") ]]; then
            echo "Quality Gate FALHOU:"
            echo "  build  → ${{ needs.build.result }}"
            echo "  lint   → ${{ needs.lint.result }}"
            echo "  test   → ${{ needs.test.result }}"
            echo "  docker → ${{ needs.docker.result }}"
            echo "  push   → ${{ needs.push.result }}"
            exit 1
          fi
          echo "Quality Gate aprovado — build, lint, testes, Docker e push OK."