name: Docker

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev, 'feat/**']

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Build da imagem Docker
    # Em PR (e na dev) só valida que a imagem builda; quem publica é o job `push`
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Valida docker-compose
        run: docker compose config -q

      - name: Configura Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tech-challenge-fiap:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push:
    name: Push para o ECR
    # Toda merge na main publica a imagem com a tag do SHA (é ela que o Deploy
    # leva ao EKS) e atualiza a tag latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      id-token: write # OIDC: troca o token do GitHub por credenciais temporárias da AWS
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Autentica na AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login no ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configura Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push (tags SHA e latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
