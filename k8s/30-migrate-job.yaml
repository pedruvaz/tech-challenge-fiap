apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: tech-challenge
  labels:
    app.kubernetes.io/name: migrate
    app.kubernetes.io/component: migration
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          # Placeholder substituído pelo sed no cd.yml:
          #   sed -i "s|tech-challenge-fiap:latest|<ghcr-tag>|g"
          image: tech-challenge-fiap:latest
          command: ["npx", "prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
