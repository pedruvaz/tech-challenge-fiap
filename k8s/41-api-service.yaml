apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: tech-challenge
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: tech-challenge-fiap
  annotations:
    # Sem esta annotation o NLB nasce interno (sem IP público)
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  # Em EKS Auto Mode, `loadBalancerClass` aciona o controller nativo e
  # provisiona um NLB nas subnets públicas (descobertas pelas tags da VPC —
  # ver infra/terraform/cluster/vpc.tf). Em kind essa classe não existe: o
  # Service fica Pending, sem quebrar nada — acesso local segue por
  # port-forward (README), que mira os pods diretamente.
  type: LoadBalancer
  loadBalancerClass: eks.amazonaws.com/nlb
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 3000
      targetPort: http
