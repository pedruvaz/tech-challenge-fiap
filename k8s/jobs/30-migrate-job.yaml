apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: tech-challenge
  labels:
    app.kubernetes.io/name: migrate
    app.kubernetes.io/component: migration
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
    spec:
      restartPolicy: OnFailure
      initContainers:
        # O host do banco vem da DATABASE_URL do Secret (local: Service `postgres`;
        # EKS: endpoint do RDS materializado do Secrets Manager) — nada hardcoded.
        - name: wait-db
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              # pg_isready usa libpq, que rejeita o parametro ?schema= (sintaxe
              # do Prisma) — valida a conexao com a URL sem a query string
              until pg_isready -d "${DATABASE_URL%%\?*}"; do
                echo "aguardando o banco..."
                sleep 2
              done
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: DATABASE_URL
      containers:
        - name: migrate
          # Placeholder substituído pelo sed no cd.yml:
          #   sed -i "s|tech-challenge-fiap:latest|<ghcr-tag>|g"
          image: tech-challenge-fiap:latest
          command: ["npx", "prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
