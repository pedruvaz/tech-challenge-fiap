# EXEMPLO — removido pelo CD antes do apply (step "Aplica os manifestos base").
# O Secret real é criado pelo step "New Relic Secret (Secrets Manager -> k8s)".
#
# Adicionar ao JSON do Secrets Manager (além das chaves já existentes):
#   NR_LICENSE_KEY  — License Key do New Relic (Account Settings > API Keys > INGEST - LICENSE)
apiVersion: v1
kind: Secret
metadata:
  name: newrelic-secrets
  namespace: tech-challenge
type: Opaque
stringData:
  NR_LICENSE_KEY: "<substituir>"
