apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: tech-challenge
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: tech-challenge-fiap
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: tech-challenge-fiap
    spec:
      # Dá tempo do preStop + shutdown hook drenarem as conexões antes do kill
      terminationGracePeriodSeconds: 30
      serviceAccountName: api
      # espera o Job de migrations ficar Complete antes de subir a API
      initContainers:
        - name: wait-migrate
          image: bitnami/kubectl:1.30
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              kubectl -n tech-challenge wait --for=condition=complete --timeout=300s job/migrate
      containers:
        - name: api
          image: tech-challenge-fiap:latest
          imagePullPolicy: IfNotPresent
          # Override do CMD do Dockerfile (que faz `migrate deploy && node dist/main`)
          # — a migration agora fica no Job/initContainer, o pod só sobe a API.
          command: ["node", "dist/main"]
          # No SIGTERM o kubelet mata o processo em paralelo à remoção do pod
          # dos endpoints do Service. O sleep segura o processo vivo enquanto o
          # endpoint some — sem ele, requests em trânsito ainda caem mesmo com
          # enableShutdownHooks() no Nest.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: JWT_ACCESS_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: JWT_REFRESH_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: DATABASE_URL
          # TODO: substituir por httpGet em /health/liveness e /health/readiness
          # após instalar @nestjs/terminus e expor o HealthModule na aplicação.
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
