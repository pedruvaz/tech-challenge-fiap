apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: tech-challenge
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        app.kubernetes.io/name: api
    spec:
      containers:
        - name: api
          # Placeholder substituído pelo sed no cd.yml:
          #   sed -i "s|tech-challenge-fiap:latest|<ghcr-tag>|g"
          image: tech-challenge-fiap:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            # Expiração dos tokens — altere conforme política de segurança
            - name: JWT_ACCESS_EXPIRES_IN
              value: "3600s"
            - name: JWT_REFRESH_EXPIRES_IN
              value: "7d"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: DATABASE_URL
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: JWT_ACCESS_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: JWT_REFRESH_SECRET
          # TODO: adicionar @nestjs/terminus e expor GET /health para probes HTTP.
          # Enquanto isso, TCP garante que o processo está ouvindo na porta.
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
# Service interno — expõe o Deployment dentro do cluster na porta 80.
# Para acesso externo, adicione um Ingress ou altere type para LoadBalancer.
# Se usar AWS Load Balancer Controller (não instalado pelo Terraform atual),
# adicione a annotation: kubernetes.io/ingress.class: alb
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: tech-challenge
  labels:
    app.kubernetes.io/name: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: 3000
  type: ClusterIP
