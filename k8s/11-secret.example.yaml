# Exemplo de Secret — NÃO comitar valores reais.
# Copie para `11-secret.yaml` (gitignored) e ajuste, ou gere via:
#   kubectl -n tech-challenge create secret generic api-secrets \
#     --from-literal=JWT_ACCESS_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=JWT_REFRESH_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=POSTGRES_USER=postgres \
#     --from-literal=POSTGRES_PASSWORD=postgres \
#     --from-literal=POSTGRES_DB=oficina \
#     --from-literal=DATABASE_URL="postgresql://postgres:postgres@postgres:5432/oficina?schema=public"
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: tech-challenge
  labels:
    app.kubernetes.io/part-of: tech-challenge-fiap
type: Opaque
stringData:
  JWT_ACCESS_SECRET: change-me-access
  JWT_REFRESH_SECRET: change-me-refresh
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: oficina
  # host = nome do Service headless do StatefulSet do Postgres
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/oficina?schema=public
