# EXEMPLO — este arquivo é removido pelo CD antes do apply (step "Aplica manifestos Kubernetes").
# Os valores reais são injetados pelo step "Aplica secrets da app" usando os GitHub Secrets.
#
# Secrets obrigatórios no repositório (Settings > Secrets > Actions):
#
#   KUBE_CONFIG            – kubeconfig em base64: $(cat ~/.kube/config | base64)
#                            Obtido via: aws eks update-kubeconfig --name tech-challenge --region us-east-1
#
#   JWT_ACCESS_SECRET      – string aleatória longa (mín. 32 chars) para HMAC do access token
#   JWT_REFRESH_SECRET     – string aleatória longa (mín. 32 chars) para HMAC do refresh token
#
#   DB_HOST                – endpoint do RDS PostgreSQL (sem a porta)
#                            Obtido via: terraform output -raw db_endpoint  (stack cluster/)
#   DB_USERNAME            – usuário do PostgreSQL (padrão: oficina_admin)
#   DB_PASSWORD            – senha gerada pelo Terraform (ver AWS Secrets Manager: tech-challenge-fiap/api)
#   DB_DATABASE            – nome do banco (padrão: oficina)
#
# O secret Kubernetes resultante (api-secrets) terá as chaves:
#   DATABASE_URL, JWT_ACCESS_SECRET, JWT_REFRESH_SECRET,
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: tech-challenge
type: Opaque
stringData:
  JWT_ACCESS_SECRET: "<substituir>"
  JWT_REFRESH_SECRET: "<substituir>"
  POSTGRES_USER: "<substituir>"
  POSTGRES_PASSWORD: "<substituir>"
  POSTGRES_DB: "<substituir>"
  DATABASE_URL: "postgresql://<usuario>:<senha>@<rds-endpoint>:5432/<banco>?schema=public"
