# SA + Role usados pelo initContainer `wait-migrate` do Deployment da API,
# que chama `kubectl -n tech-challenge wait job/migrate` pra segurar o rollout
# até as migrations terminarem. Escopo restrito: só get/list/watch em jobs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: tech-challenge
  labels:
    app.kubernetes.io/part-of: tech-challenge-fiap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-wait-job
  namespace: tech-challenge
  labels:
    app.kubernetes.io/part-of: tech-challenge-fiap
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-wait-job
  namespace: tech-challenge
  labels:
    app.kubernetes.io/part-of: tech-challenge-fiap
subjects:
  - kind: ServiceAccount
    name: api
    namespace: tech-challenge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: api-wait-job
