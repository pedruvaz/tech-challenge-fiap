apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: tech-challenge
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: tech-challenge-fiap
data:
  NODE_ENV: production
  PORT: "3000"
  JWT_ACCESS_EXPIRES_IN: 15m
  # Base pública da API, usada nos links de aprovar/rejeitar que vão por e-mail
  # (src/modules/aprovacao). O valor abaixo serve para kind/local; no EKS o
  # deploy substitui pelo hostname do NLB, que só existe depois de provisionado
  # — ver .github/workflows/deploy.yml. Sem isso os links sairiam apontando para
  # localhost e o cliente nunca conseguiria aprovar.
  APP_URL: "http://localhost:3000"
  # Origem liberada no CORS (src/main.ts). No EKS o deploy substitui pelo
  # endpoint do site no S3; sem bater com a origem real, o browser bloqueia
  # toda chamada do front.
  FRONTEND_URL: "http://localhost:5173"
  JWT_REFRESH_EXPIRES_IN: 7d
  # OpenTelemetry (src/tracing.ts). Com `console`, os spans saem no stdout —
  # visíveis em `kubectl logs deployment/api`, sem nenhuma peça extra no
  # cluster. Quando houver um collector/Jaeger, trocar por
  # OTEL_EXPORTER_OTLP_ENDPOINT apontando para ele (o console vira fallback
  # ignorado). Sem nenhuma das duas envs, o SDK nem inicializa.
  OTEL_SERVICE_NAME: tech-challenge-fiap-api
  OTEL_TRACES_EXPORTER: console
